{% extends "layout.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-icon" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
      <i class="fa-solid fa-key"></i>
    </div>

    <h1 class="auth-title">Tech Africa IT Recovery</h1>
    <p class="auth-subtitle">Tech Africa IT &bull; Enter your registered email address and we'll send you a <strong>6-digit verification code</strong> to reset your secure access password.</p>

    <form method="POST" action="/employee/forgot-password" autocomplete="off">
      <div class="mb-4">
        <label class="form-label"><i class="fa-solid fa-envelope me-1"></i> Registered Email or Username</label>
        <input
          id="email"
          name="email"
          type="text"
          class="form-control"
          placeholder="Enter your email or username"
          required
          autofocus
        >
      </div>

      <button type="submit" class="btn-primary-custom mt-2" id="sendOtpBtn"
        style="background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 4px 20px rgba(245,158,11,0.3);"
        onclick="if(document.getElementById('email').value.trim()){ this.innerHTML='<i class=\'fa-solid fa-spinner fa-spin me-2\'></i> Sending Code...'; }">
        <i class="fa-solid fa-paper-plane me-2"></i> Send Verification Code
      </button>
    </form>

    <hr class="divider">
    <p class="auth-link">
      Remembered your password? <a href="/">Sign in here</a>
    </p>

  </div>
</div>
{% endblock %}
